noindex: true
name: Elena Spatoulas Patel
eyebrow: Economist · Tax and fiscal policy
headline: How tax systems, public institutions, and the safety net shape economic behavior.
bio: >-
  I am a senior fellow in Economic Studies at the Brookings Institution, co-director of the
  Urban-Brookings Tax Policy Center, and the Robert E. Pozen Director's Chair. I am also an editor of
  the National Tax Journal. My research spans
  tax policy, social insurance and health, housing and infrastructure, the governance of firms and
  nonprofits, and postal policy. I was previously on the faculty of the University of Utah's David
  Eccles School of Business, and served at the Council of Economic Advisers and the Treasury's
  Office of Tax Analysis.
short_bio: >-
  Senior fellow in Economic Studies at the Brookings Institution and co-director of the
  Urban-Brookings Tax Policy Center.
